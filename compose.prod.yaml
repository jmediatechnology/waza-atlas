# Production: code baked into the image, data on a named volume.
#   APP_SECRET=$(openssl rand -hex 32) MOTION_UPLOAD_TOKEN=$(openssl rand -hex 24) \
#   SERVER_NAME=waza.example.com \
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  app:
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET, e.g. APP_SECRET=$(openssl rand -hex 32)}
      # Point at Postgres or MySQL instead of the bundled SQLite file if you prefer:
      # DATABASE_URL: postgresql://waza:secret@db:5432/waza?serverVersion=17&charset=utf8
    volumes:
      - storage:/srv/storage
    ports: !reset []          # Caddy reaches it internally, no host port needed
    networks:
      default:
      proxy:
        aliases: [waza-atlas]

networks:
  proxy:
    external: true

volumes:
  storage:
