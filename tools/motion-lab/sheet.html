<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff;font:11px system-ui">
<canvas id="c"></canvas>
<script src="build/core.browser.js"></script>
<script>
window.render=(m,times)=>{
  const {keyed,frame,BONES,JN}=LAB;
  const M={duration:m.duration,phases:m.phases,tori:keyed(m.tracks.tori),uke:keyed(m.tracks.uke)};
  const cell=190, views=[['side (from +x)',p=>[p[2],p[1]]],['front (from -z)',p=>[-p[0],p[1]]],['3/4',p=>[0.7*p[2]-0.7*p[0],p[1]+0.25*(0.7*p[0]+0.7*p[2])]],['top',p=>[p[2],-p[0]]]];
  const cv=document.getElementById('c'); cv.width=cell*times.length; cv.height=cell*views.length+18; const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
  times.forEach((t,ci)=>{
    const F=frame(M,t); let ph=''; for(const p of m.phases) if(t>=p.t) ph=p.name;
    g.fillStyle='#000'; g.fillText(`${t.toFixed(2)}s ${ph}`,ci*cell+4,12);
    views.forEach(([vn,P],ri)=>{
      const ox=ci*cell+cell/2, oy=18+ri*cell+cell*0.86, k=cell/2.9;
      g.strokeStyle='#ddd'; g.strokeRect(ci*cell,18+ri*cell,cell,cell);
      if(ci===0){g.fillStyle='#999';g.fillText(vn,4,18+ri*cell+cell-4);}
      if(vn!=='top'){g.strokeStyle='#bbb';g.beginPath();g.moveTo(ci*cell,oy);g.lineTo(ci*cell+cell,oy);g.stroke();}
      const to=(p)=>{const [a,b]=P(p); return vn==='top'?[ox+a*k, 18+ri*cell+cell/2+b*k]:[ox+a*k, oy-b*k];};
      F.forEach((J,fi)=>{
        const col=fi?'#2f6bff':'#222';
        g.lineWidth=2.4; g.lineCap='round';
        for(const [a,b] of BONES){ const L=a.startsWith('l')||b.startsWith('l'); g.strokeStyle=L?(fi?'#9db8ff':'#888'):col; const p=to(J[a]),q=to(J[b]); g.beginPath();g.moveTo(...p);g.lineTo(...q);g.stroke(); }
        const h=to(J.head); g.fillStyle=col; g.beginPath(); g.arc(h[0],h[1],4.5,0,7); g.fill();
      });
    });
  });
};
</script>
